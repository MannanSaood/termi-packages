name: Stage GitHub APT pilot assets
on:
  workflow_dispatch:
    inputs:
      verify_tag:
        description: Signed pilot release tag to verify instead of staging a new pilot
        required: false
permissions:
  contents: write
concurrency:
  group: termi-apt-pilot
  cancel-in-progress: false
jobs:
  stage:
    if: inputs.verify_tag == '' && github.event.repository.full_name == 'MannanSaood/termi-packages' && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify source and stage individual release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/termux/stage_apt_pilot.py
  verify:
    if: inputs.verify_tag != '' && github.event.repository.full_name == 'MannanSaood/termi-packages'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify the signed flat repository with real APT downloads
        env:
          PILOT_TAG: ${{ inputs.verify_tag }}
        run: bash scripts/termux/verify_apt_pilot.sh
