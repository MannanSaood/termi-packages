name: Termi LDC host bootstrap diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: termi-ldc-host-probe
  cancel-in-progress: false
jobs:
  probe:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Fetch exact recipe-pinned upstream host bootstrap and source
        run: |
          mkdir -p build/probe
          cd build/probe
          curl --fail --location --retry 3 --max-time 300 -o host.tar.xz https://github.com/ldc-developers/ldc/releases/download/v1.30.0/ldc2-1.30.0-linux-x86_64.tar.xz
          curl --fail --location --retry 3 --max-time 300 -o source.tar.gz https://github.com/ldc-developers/ldc/releases/download/v1.30.0/ldc-1.30.0-src.tar.gz
          curl --fail --location --retry 3 --max-time 300 -o cmake.tar.gz https://github.com/Kitware/CMake/releases/download/v3.31.10/cmake-3.31.10-linux-x86_64.tar.gz
          printf '%s\n' '5784d4cc47d0845af0897d3b7473a08dd0281a4cdabac0a486740840d014fde1  host.tar.xz' 'fdbb376f08242d917922a6a22a773980217fafa310046fc5d6459490af23dacd  source.tar.gz' | sha256sum --check --strict
          tar -xf host.tar.xz
          tar -xf source.tar.gz
          printf '%s\n' '3cb3dd247b6a1de2d0f4b20c6fd4326c9024e894cebc9dc8699758887e566ca7  cmake.tar.gz' | sha256sum --check --strict
          tar -xf cmake.tar.gz
          curl --fail --location --retry 3 --max-time 300 -o libxml2-2.13.9.tar.xz https://download.gnome.org/sources/libxml2/2.13/libxml2-2.13.9.tar.xz
          printf '%s\n' 'a2c9ae7b770da34860050c309f903221c67830c86e4a7e760692b803df95143a  libxml2-2.13.9.tar.xz' | sha256sum --check --strict
          cd ../..
          PYTHONPATH=scripts/termux python3 -c 'from catalog_repairs import LDC_HOST_XML_SETUP; print(LDC_HOST_XML_SETUP)' > build/probe/ldc-host-xml.sh
      - name: Probe compiler and actual CMake detection in pinned builder
        run: |
          image=$(python3 -c 'import json; print(json.load(open("packages/termux/upstream.lock.json"))["builder_image"])')
          docker run --rm --network none --cpus 2 --memory 1g --pids-limit 128 \
            --security-opt no-new-privileges \
            --mount "type=bind,source=$PWD/build/probe,target=/inputs,readonly" \
            --mount "type=bind,source=$PWD/scripts/termux/probe_ldc_host.sh,target=/probe.sh,readonly" \
            "$image" bash /probe.sh
