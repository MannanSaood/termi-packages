name: Stage full Termi APT catalog
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Prepare checked indexes or upload verified packages to staging
        type: choice
        options: [prepare, upload]
        required: true
permissions:
  contents: write
concurrency:
  group: termi-apt-catalog-staging
  cancel-in-progress: false
jobs:
  stage:
    if: github.repository == 'MannanSaood/termi-packages' && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.phase == 'upload' && 1 || 7 }}
      matrix:
        shard: [main-0, main-1, main-2, main-3, x11-0, x11-1, root-0]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify archive hashes and stage shard
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE_PHASE: ${{ inputs.phase }}
          STAGE_SHARD: ${{ matrix.shard }}
        run: python3 scripts/termux/stage_apt_catalog.py "$STAGE_PHASE" "$STAGE_SHARD"
  verify:
    if: inputs.phase == 'upload'
    needs: stage
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify all signed APT shards and the Carbonyl and Git Annex transaction
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          mkdir -p "$work/lists/partial" "$work/cache/archives/partial" "$work/empty"
          touch "$work/status"
          keyring="$PWD/packages/termux/repository/repository-keyring.gpg"
          root=https://github.com/MannanSaood/termi-packages/releases/download/apt-catalog-3268-v1
          for shard in main-{0..3} x11-{0..1} root-0; do
            printf 'deb [arch=aarch64 signed-by=%s] %s-%s ./\n' "$keyring" "$root" "$shard"
          done > "$work/all.list"
          grep -v -- '-root-0 ' "$work/all.list" > "$work/main-x11.list"
          opts=(-o "Dir::Etc::sourceparts=$work/empty" -o "Dir::State::lists=$work/lists"
                -o "Dir::State::status=$work/status" -o "Dir::Cache=$work/cache"
                -o APT::Architecture=aarch64 -o APT::Architectures::=aarch64
                -o APT::Sandbox::User="$(id -un)" -o Acquire::Retries=3)
          apt-get "${opts[@]}" -o "Dir::Etc::sourcelist=$work/all.list" update
          apt-get "${opts[@]}" -o "Dir::Etc::sourcelist=$work/main-x11.list" \
            -s --no-install-recommends install git=2.56.0-2 git-annex=10.20261006-1 carbonyl=0.0.3-5
          echo 'All seven signed staging repositories passed APT update'
