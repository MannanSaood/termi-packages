name: Stage full Termi APT catalog
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Prepare checked indexes or upload verified packages to staging
        type: choice
        options: [prepare, upload]
        required: true
permissions:
  contents: write
concurrency:
  group: termi-apt-catalog-staging
  cancel-in-progress: false
jobs:
  stage:
    if: github.repository == 'MannanSaood/termi-packages' && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.phase == 'upload' && 1 || 7 }}
      matrix:
        shard: [main-0, main-1, main-2, main-3, x11-0, x11-1, root-0]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify archive hashes and stage shard
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE_PHASE: ${{ inputs.phase }}
          STAGE_SHARD: ${{ matrix.shard }}
        run: python3 scripts/termux/stage_apt_catalog.py "$STAGE_PHASE" "$STAGE_SHARD"
